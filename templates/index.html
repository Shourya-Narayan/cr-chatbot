<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CR Chatbot 🎓</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      background: linear-gradient(-45deg, #050505, #1B092A, #2F0B38, #0A192F, #050505);
      background-size: 300% 300%;
      animation: aurora 20s ease infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes aurora {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1 {
      color: #e0d7ff;
      margin: 24px 0 12px;
      font-size: 1.6rem;
      letter-spacing: 1px;
      text-shadow: 0 0 20px rgba(180,130,255,0.5);
    }

    #chat-container {
      width: 100%;
      max-width: 780px;
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .bubble {
      padding: 14px 18px;
      border-radius: 16px;
      max-width: 85%;
      line-height: 1.6;
      font-size: 0.95rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      color: #e8e0ff;
      word-wrap: break-word;
    }
    .bubble a { color: #a78bfa; }
    .bubble strong { color: #c4b5fd; }
    .bubble p { margin-bottom: 6px; }
    .bubble p:last-child { margin-bottom: 0; }

    .bubble.assistant {
      background: rgba(255,255,255,0.04);
      align-self: flex-start;
      border-radius: 4px 16px 16px 16px;
    }

    .bubble.user {
      background: rgba(124,58,237,0.25);
      align-self: flex-end;
      border-radius: 16px 4px 16px 16px;
    }

    .bubble.error {
      background: rgba(220,38,38,0.2);
      border-color: rgba(220,38,38,0.4);
      align-self: flex-start;
    }

    .typing {
      display: flex;
      gap: 5px;
      padding: 14px 18px;
      align-self: flex-start;
    }
    .typing span {
      width: 8px; height: 8px;
      background: #a78bfa;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-8px); }
    }

    #input-area {
      width: 100%;
      max-width: 780px;
      padding: 12px 16px 20px;
      display: flex;
      gap: 10px;
    }

    #user-input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(15px);
      color: #e8e0ff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #user-input::placeholder { color: rgba(200,180,255,0.4); }
    #user-input:focus { border-color: rgba(167,139,250,0.5); }

    #send-btn {
      padding: 12px 22px;
      border-radius: 24px;
      border: none;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    #send-btn:hover { opacity: 0.88; }
    #send-btn:active { transform: scale(0.97); }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>🎓 Class Rep Chatbot</h1>

  <div id="chat-container"></div>

  <div id="input-area">
    <input id="user-input" type="text" placeholder="Ask a question..." autocomplete="off"/>
    <button id="send-btn">Send ➤</button>
  </div>

  <script>
    const chat = document.getElementById("chat-container");
    const input = document.getElementById("user-input");
    const btn = document.getElementById("send-btn");

    // Render welcome message (markdown-supported)
    const welcomeRaw = {{ welcome | tojson }};
    addBubble("assistant", welcomeRaw);

    function addBubble(role, text) {
      const div = document.createElement("div");
      div.className = `bubble ${role}`;
      div.innerHTML = marked.parse(text);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement("div");
      div.className = "typing";
      div.id = "typing-indicator";
      div.innerHTML = "<span></span><span></span><span></span>";
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById("typing-indicator");
      if (t) t.remove();
    }

    async function sendMessage() {
      const msg = input.value.trim();
      if (!msg) return;

      input.value = "";
      btn.disabled = true;
      addBubble("user", msg);
      showTyping();

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg })
        });
        const data = await res.json();
        removeTyping();

        if (data.reply) {
          addBubble("assistant", data.reply);
        } else {
          addBubble("error", "❌ " + (data.error || "Something went wrong."));
        }
      } catch (err) {
        removeTyping();
        addBubble("error", "❌ Network error. Please try again.");
      }

      btn.disabled = false;
      input.focus();
    }

    btn.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) sendMessage();
    });
  </script>
</body>
</html>
