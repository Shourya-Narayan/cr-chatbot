<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CR Chatbot 🎓</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple-glow: rgba(139, 92, 246, 0.6);
      --glass-bg: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.09);
      --text-primary: #ede9fe;
      --text-muted: rgba(200,185,255,0.5);
      --accent: #8b5cf6;
      --accent2: #6366f1;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: #07030f;
      overflow: hidden;
    }

    /* ── AURORA BG ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: linear-gradient(-45deg, #07030f, #170926, #0f1a3a, #1e0733, #07030f);
      background-size: 400% 400%;
      animation: aurora 18s ease infinite;
      z-index: 0;
    }
    /* Orb accents */
    body::after {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(109,40,217,0.18) 0%, transparent 70%);
      top: -150px; left: -150px;
      z-index: 0;
      animation: orbFloat 12s ease-in-out infinite alternate;
    }
    @keyframes aurora {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes orbFloat {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(80px, 60px) scale(1.15); }
    }

    /* ── LAYOUT ── */
    #app {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      height: 100vh;
      max-width: 820px;
      margin: 0 auto;
    }

    /* ── HEADER ── */
    #header {
      display: flex; align-items: center; gap: 14px;
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(10,4,25,0.5);
      backdrop-filter: blur(20px);
      flex-shrink: 0;
    }
    #header .avatar {
      width: 42px; height: 42px; border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #4338ca);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 0 18px rgba(124,58,237,0.5);
      flex-shrink: 0;
    }
    #header .info h1 {
      font-size: 1rem; font-weight: 600;
      color: var(--text-primary); letter-spacing: 0.3px;
    }
    #header .info p {
      font-size: 0.72rem; color: #4ade80;
      display: flex; align-items: center; gap: 5px; margin-top: 2px;
    }
    #header .info p::before {
      content: ''; width: 6px; height: 6px;
      background: #4ade80; border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 6px #4ade80;
    }
    #header .badge {
      margin-left: auto;
      font-size: 0.65rem; font-weight: 600;
      padding: 4px 10px; border-radius: 20px;
      background: rgba(139,92,246,0.15);
      border: 1px solid rgba(139,92,246,0.3);
      color: #c4b5fd; letter-spacing: 0.5px;
    }

    /* ── CHAT AREA ── */
    #chat-container {
      flex: 1; overflow-y: auto;
      padding: 20px 18px 10px;
      display: flex; flex-direction: column; gap: 6px;
      scrollbar-width: thin;
      scrollbar-color: rgba(139,92,246,0.3) transparent;
    }
    #chat-container::-webkit-scrollbar { width: 4px; }
    #chat-container::-webkit-scrollbar-thumb {
      background: rgba(139,92,246,0.3); border-radius: 4px;
    }

    /* ── MESSAGE ROWS ── */
    .msg-row {
      display: flex; align-items: flex-end; gap: 10px;
      animation: fadeUp 0.25s ease forwards;
      opacity: 0;
    }
    .msg-row.user { flex-direction: row-reverse; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem;
    }
    .msg-row.assistant .msg-avatar {
      background: linear-gradient(135deg, #7c3aed, #4338ca);
      box-shadow: 0 0 10px rgba(124,58,237,0.4);
    }
    .msg-row.user .msg-avatar {
      background: linear-gradient(135deg, #1d4ed8, #7c3aed);
    }

    /* ── BUBBLES ── */
    .bubble-wrap { display: flex; flex-direction: column; max-width: 78%; }
    .msg-row.user .bubble-wrap { align-items: flex-end; }

    .bubble {
      padding: 11px 16px;
      line-height: 1.65;
      font-size: 0.88rem;
      color: var(--text-primary);
      word-wrap: break-word;
      position: relative;
    }
    .bubble a { color: #a78bfa; text-decoration: underline; }
    .bubble strong { color: #ddd6fe; }
    .bubble p { margin-bottom: 5px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ul, .bubble ol { padding-left: 18px; margin-top: 4px; }
    .bubble li { margin-bottom: 3px; }
    .bubble code {
      background: rgba(139,92,246,0.15);
      padding: 1px 6px; border-radius: 4px;
      font-size: 0.82rem; font-family: monospace;
      color: #c4b5fd;
    }

    .msg-row.assistant .bubble {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: 4px 18px 18px 18px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.2);
    }
    .msg-row.user .bubble {
      background: linear-gradient(135deg, rgba(109,40,217,0.3), rgba(67,56,202,0.3));
      backdrop-filter: blur(14px);
      border: 1px solid rgba(139,92,246,0.25);
      border-radius: 18px 4px 18px 18px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.2);
    }
    .msg-row.error .bubble {
      background: rgba(220,38,38,0.15);
      border: 1px solid rgba(220,38,38,0.35);
      border-radius: 4px 18px 18px 18px;
    }

    .timestamp {
      font-size: 0.62rem;
      color: var(--text-muted);
      margin-top: 4px;
      padding: 0 4px;
    }

    /* ── DATE DIVIDER ── */
    .divider {
      text-align: center; font-size: 0.68rem;
      color: var(--text-muted); margin: 8px 0;
      display: flex; align-items: center; gap: 10px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px; background: var(--glass-border);
    }

    /* ── TYPING INDICATOR ── */
    .typing-row {
      display: flex; align-items: flex-end; gap: 10px;
      animation: fadeUp 0.2s ease forwards; opacity: 0;
    }
    .typing-bubble {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border);
      border-radius: 4px 18px 18px 18px;
      padding: 13px 18px;
      display: flex; gap: 5px; align-items: center;
      backdrop-filter: blur(14px);
    }
    .typing-bubble span {
      width: 7px; height: 7px;
      background: #a78bfa; border-radius: 50%;
      animation: bounce 1.3s ease infinite;
    }
    .typing-bubble span:nth-child(2) { animation-delay: 0.18s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
      30% { transform: translateY(-7px); opacity: 1; }
    }

    /* ── INPUT AREA ── */
    #input-area {
      padding: 14px 18px 20px;
      background: rgba(8,4,20,0.6);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--glass-border);
      flex-shrink: 0;
    }
    #input-row {
      display: flex; gap: 10px; align-items: center;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      padding: 6px 6px 6px 18px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #input-row:focus-within {
      border-color: rgba(139,92,246,0.5);
      box-shadow: 0 0 0 3px rgba(139,92,246,0.08);
    }
    #user-input {
      flex: 1; border: none; background: transparent;
      color: var(--text-primary); font-size: 0.9rem;
      font-family: inherit; outline: none;
      padding: 6px 0;
    }
    #user-input::placeholder { color: var(--text-muted); }
    #send-btn {
      width: 40px; height: 40px; border-radius: 50%;
      border: none; flex-shrink: 0;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: white; font-size: 1rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 0 14px rgba(124,58,237,0.4);
    }
    #send-btn:hover { opacity: 0.9; box-shadow: 0 0 20px rgba(124,58,237,0.6); }
    #send-btn:active { transform: scale(0.93); }
    #send-btn:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; }
    #hint {
      text-align: center; font-size: 0.62rem;
      color: var(--text-muted); margin-top: 8px;
    }

    /* ── MOBILE ── */
    @media (max-width: 600px) {
      #header { padding: 14px 16px 12px; }
      #chat-container { padding: 14px 12px 8px; }
      #input-area { padding: 10px 12px 16px; }
      .bubble-wrap { max-width: 88%; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div id="header">
    <div class="avatar">🎓</div>
    <div class="info">
      <h1>Class Rep Chatbot</h1>
      <p>Online</p>
    </div>
    <div class="badge">IIIT BH</div>
  </div>

  <!-- CHAT -->
  <div id="chat-container"></div>

  <!-- INPUT -->
  <div id="input-area">
    <div id="input-row">
      <input id="user-input" type="text" placeholder="Ask anything..." autocomplete="off"/>
      <button id="send-btn" title="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <p id="hint">Press Enter to send &nbsp;·&nbsp; Powered by Gemini</p>
  </div>

</div>

<script>
  const chat  = document.getElementById("chat-container");
  const input = document.getElementById("user-input");
  const btn   = document.getElementById("send-btn");

  const welcomeRaw = {{ welcome | tojson }};

  function getTime() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function addDivider(label) {
    const d = document.createElement("div");
    d.className = "divider";
    d.textContent = label;
    chat.appendChild(d);
  }

  function addMessage(role, text) {
    const row = document.createElement("div");
    row.className = `msg-row ${role}`;

    const avatarEl = document.createElement("div");
    avatarEl.className = "msg-avatar";
    avatarEl.textContent = role === "assistant" ? "🎓" : "🧑";

    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = marked.parse(text);

    const ts = document.createElement("div");
    ts.className = "timestamp";
    ts.textContent = getTime();

    wrap.appendChild(bubble);
    wrap.appendChild(ts);
    row.appendChild(avatarEl);
    row.appendChild(wrap);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return row;
  }

  function showTyping() {
    const row = document.createElement("div");
    row.className = "typing-row";
    row.id = "typing-indicator";

    const avatarEl = document.createElement("div");
    avatarEl.className = "msg-avatar";
    avatarEl.style.background = "linear-gradient(135deg,#7c3aed,#4338ca)";
    avatarEl.style.boxShadow = "0 0 10px rgba(124,58,237,0.4)";
    avatarEl.textContent = "🎓";

    const bubble = document.createElement("div");
    bubble.className = "typing-bubble";
    bubble.innerHTML = "<span></span><span></span><span></span>";

    row.appendChild(avatarEl);
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById("typing-indicator");
    if (t) t.remove();
  }

  // Initial divider + welcome
  addDivider("Today");
  addMessage("assistant", welcomeRaw);

  async function sendMessage() {
    const msg = input.value.trim();
    if (!msg) return;
    input.value = "";
    btn.disabled = true;

    addMessage("user", msg);
    showTyping();

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg })
      });
      const data = await res.json();
      removeTyping();
      if (data.reply) {
        addMessage("assistant", data.reply);
      } else {
        addMessage("error", "❌ " + (data.error || "Something went wrong."));
      }
    } catch (err) {
      removeTyping();
      addMessage("error", "❌ Network error. Please try again.");
    }
    btn.disabled = false;
    input.focus();
  }

  btn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) sendMessage();
  });
</script>
</body>
</html>
