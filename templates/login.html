<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login — CR Chatbot</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(-45deg,#07030f,#170926,#0f1a3a,#1e0733,#07030f);
      background-size:400% 400%;animation:aurora 18s ease infinite;
    }
    @keyframes aurora{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    .card{
      background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);
      backdrop-filter:blur(20px);border-radius:24px;padding:48px 40px;
      text-align:center;max-width:380px;width:90%;
      box-shadow:0 20px 60px rgba(0,0,0,0.4);
    }
    .logo{font-size:3rem;margin-bottom:16px}
    h1{color:#ede9fe;font-size:1.4rem;font-weight:600;margin-bottom:8px}
    p{color:rgba(200,185,255,0.55);font-size:0.85rem;margin-bottom:32px;line-height:1.6}
    .google-btn{
      display:flex;align-items:center;justify-content:center;gap:12px;
      width:100%;padding:13px 20px;border-radius:50px;border:1px solid rgba(255,255,255,0.15);
      background:rgba(255,255,255,0.07);color:#ede9fe;font-size:0.92rem;font-weight:500;
      text-decoration:none;transition:background 0.2s,border-color 0.2s,box-shadow 0.2s;cursor:pointer;
    }
    .google-btn:hover{background:rgba(255,255,255,0.12);border-color:rgba(139,92,246,0.5);box-shadow:0 0 20px rgba(139,92,246,0.2)}
    .google-btn img{width:20px;height:20px}
    .footer{margin-top:28px;font-size:0.68rem;color:rgba(200,185,255,0.3)}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🎓</div>
    <h1>CR Chatbot</h1>
    <p>Sign in with your IIIT BH Google account to access class updates and announcements.</p>
    <a href="/google-login" class="google-btn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"/>
      Continue with Google
    </a>
    <div class="footer">IIIT Bhagalpur · Class Representative Portal</div>
  </div>
</body>
</html>
