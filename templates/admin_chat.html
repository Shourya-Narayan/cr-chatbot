<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{{ user.name }} — Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;min-height:100vh;
      background:linear-gradient(-45deg,#07030f,#170926,#0f1a3a,#1e0733);
      background-size:400% 400%;animation:aurora 18s ease infinite;color:#ede9fe;padding:28px 20px}
    @keyframes aurora{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    .container{max-width:760px;margin:0 auto}
    .top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
    .av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#6d28d9,#4338ca);display:flex;align-items:center;justify-content:center;font-size:0.9rem;font-weight:600;flex-shrink:0}
    .info h2{font-size:1rem;font-weight:600}
    .info p{font-size:0.73rem;color:rgba(200,185,255,0.5);margin-top:2px}
    .back{margin-left:auto;padding:7px 16px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:#ede9fe;text-decoration:none;font-size:0.8rem}
    .back:hover{background:rgba(255,255,255,0.11)}
    .log{display:flex;flex-direction:column;gap:10px}
    .msg{display:flex;flex-direction:column;max-width:76%}
    .msg.user{align-self:flex-end;align-items:flex-end}
    .msg.assistant{align-self:flex-start}
    .bubble{padding:10px 15px;font-size:0.87rem;line-height:1.65;color:#ede9fe}
    .msg.assistant .bubble{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(12px);border-radius:4px 16px 16px 16px}
    .msg.user .bubble{background:linear-gradient(135deg,rgba(109,40,217,0.28),rgba(67,56,202,0.28));border:1px solid rgba(139,92,246,0.22);border-radius:16px 4px 16px 16px}
    .bubble p{margin-bottom:5px}.bubble p:last-child{margin-bottom:0}
    .bubble a{color:#a78bfa}.bubble strong{color:#ddd6fe}
    .time{font-size:0.6rem;color:rgba(200,185,255,0.38);margin-top:3px;padding:0 3px}
    .empty{text-align:center;padding:60px;color:rgba(200,185,255,0.35)}
    @media(max-width:600px){
      body{padding:16px 10px}
      .top{gap:10px}
      .av{width:36px;height:36px;font-size:0.8rem}
      .msg{max-width:92%}
      .bubble{font-size:0.84rem;padding:9px 13px}
    }
  </style>
</head>
<body>
<div class="container">
  <div class="top">
    <div class="av">{{ user.name[:2].upper() }}</div>
    <div class="info">
      <h2>{{ user.name }}</h2>
      <p>{{ messages|length }} messages total</p>
    </div>
    <a href="/admin" class="back">← All Students</a>
  </div>
  <div class="log" id="log">
    {% if messages %}
      {% for m in messages %}
      <div class="msg {{ m.role }}">
        <div class="bubble" data-md="{{ m.content | e }}"></div>
        <div class="time">{{ m.time }}</div>
      </div>
      {% endfor %}
    {% else %}
      <div class="empty">No messages yet.</div>
    {% endif %}
  </div>
</div>
<script>
  document.querySelectorAll(".bubble[data-md]").forEach(el=>{
    el.innerHTML=marked.parse(el.dataset.md);
  });
</script>
</body>
</html>
